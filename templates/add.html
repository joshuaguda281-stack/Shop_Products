{% extends 'master.html' %}
{% load django_bootstrap5 %}

{% block title %}Add Product{% endblock %}

{% block content %}
    <div class="container">
    <h2>Add New Product</h2>
    <form action="{% url 'add' %}" method="post">
       {% csrf_token %}
        {% bootstrap_form form %}
        <button class="btn btn-outline-primary" type="submit">Submit</button>
    </form>
    </div>
{% endblock %}
